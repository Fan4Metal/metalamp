[package]
# The identifier: the exe, the Cargo package, the GitHub repository, the
# single-instance names. The display name ("MetalAMP") lives in main.rs,
# setup.iss, build.rs and the READMEs (see SKILL.md, "Имя приложения").
name = "metalamp"
# Between releases: the next version with "-dev", the last number raised by
# one (after 0.1.0, "0.1.1-dev"); a release drops it.
version = "0.2.1-dev"
authors = ["Fan4_Metal"]
edition = "2024"
# One sentence, English: it is shown in About, in the exe's version
# resource (build.rs) and as the README tagline.
description = "A fast audio player with a media library for Windows"
license = "MIT"
repository = "https://github.com/Fan4Metal/metalamp"

[dependencies]
# glow, not the default wgpu: a smaller binary and a faster start (an OpenGL
# context is created in ~130 ms against ~240 ms for wgpu on DX12). eframe's
# default features are off: no accesskit, no wgpu and no `links` (URLs are
# opened through win::shell_open instead of ui.hyperlink_to). No
# `persistence` either: the settings, the window's place among them, are
# the app's own JSON (settings.rs).
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36"
# File and folder dialogs without default features: only windows-sys,
# raw-window-handle and log are pulled in.
rfd = { version = "0.17.2", default-features = false }
raw-window-handle = "0.6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The settings folder in %APPDATA%.
directories = "6"
env_logger = "0.11"
# The library: tags and properties, the folder walk, tags read in parallel.
lofty = "0.25.4"
walkdir = "2.5"
rayon = "1.12"
# Covers: JPEG and PNG only, decoded within limits; thumbnails kept as JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
# Keep the feature list minimal; add a feature only for an API that is used.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",            # GetUserDefaultUILanguage (i18n), WideCharToMultiByte (ID3v1)
    "Win32_Networking_WinHttp",       # the update check
    "Win32_System_Console",           # AttachConsole for the command line modes
    "Win32_Graphics_Gdi",             # WNDCLASSW (one instance)
    "Win32_Security",                 # CreateMutexW's attributes (one instance)
    "Win32_System_DataExchange",      # WM_COPYDATA (one instance)
    "Win32_System_LibraryLoader",     # GetModuleHandleW (one instance)
    "Win32_System_Registry",          # file associations (assoc.rs)
    "Win32_System_Threading",         # CreateMutexW (one instance)
    "Win32_Storage_FileSystem",       # change notifications (watching the folders)
    "Win32_System_Time",              # local dates (the tables' dates)
    "Win32_UI_Shell",                 # ShellExecuteW
    "Win32_UI_WindowsAndMessaging",   # SW_SHOWNORMAL
] }

# Playback: Media Foundation decodes, WASAPI plays (COM interfaces, as in
# qrec); windows-sys stays for the rest.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",          # AvSetMmThreadCharacteristicsW (MMCSS)
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",  # PKEY_Device_FriendlyName (the device list)
    "Win32_UI_Shell_PropertiesSystem",  # IPropertyStore (the device list)
] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon and the version information into the exe.
winresource = "0.1"

[build-dependencies]
# The icons' 256 px layers as PNG.
png = "0.18"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding, so that a panic in another crate's parser on a damaged file
# is caught (guard.rs) and the file left out; any other panic still ends
# the process, main::install_panic_hook showing it first.
panic = "unwind"
strip = true

[profile.dev]
opt-level = 1

# Dependencies optimised in debug builds too, so that a debug build is usable.
[profile.dev.package."*"]
opt-level = 3
